spring:
  application:
    name: PrintMasterCRM
  datasource:
    # Значения по умолчанию подходят для локальной БД. В Docker и на сервере задаются переменными окружения.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration
    schemas: public
