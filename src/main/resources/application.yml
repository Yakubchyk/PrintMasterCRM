spring:
  application:
    name: PrintMasterCRM
  datasource:
    # База лежит одним файлом в домашней папке: PrintMasterCRM-data/printmaster.mv.db
    # Папку можно сменить переменной окружения PRINTMASTER_DATA.
    url: jdbc:h2:file:${PRINTMASTER_DATA:${user.home}/PrintMasterCRM-data}/printmaster
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    prefix: classpath:/templates/
  h2:
    console:
      enabled: false

server:
  # Входа по паролю нет, поэтому программа доступна только с этого компьютера.
  address: 127.0.0.1
  port: 8080
