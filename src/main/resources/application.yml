spring:
  application:
    name: PrintMasterCRM
  datasource:
    # Значения по умолчанию подходят для локальной БД. В Docker и на сервере задаются переменными окружения.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    # Без open-in-view запросы к БД выполняются только в сервисах, а не при рендеринге шаблонов
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Для БД, созданной без Flyway: SPRING_FLYWAY_BASELINE_ON_MIGRATE=true (однократно)
    enabled: true
    locations: classpath:db/migration
    schemas: public
