spring:
  application:
    name: PrintMasterCRM
  datasource:
    # База лежит одним файлом в домашней папке: PrintMasterCRM-data/printmaster.mv.db
    # Папку можно сменить переменной окружения PRINTMASTER_DATA.
    url: jdbc:h2:file:${PRINTMASTER_DATA:${user.home}/PrintMasterCRM-data}/printmaster
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    prefix: classpath:/templates/
  h2:
    console:
      enabled: false

server:
  # Входа по паролю нет, поэтому программа доступна только с этого компьютера.
  address: 127.0.0.1
  # Порт 8765, чтобы не мешать другим программам на 8080
  port: 8765

printmaster:
  # Открывать браузер при запуске: включают start.command и приложение .app (в IntelliJ выключено)
  open-browser: false

logging:
  file:
    name: ${PRINTMASTER_DATA:${user.home}/PrintMasterCRM-data}/printmaster.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 4
