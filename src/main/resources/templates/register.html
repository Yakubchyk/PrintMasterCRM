<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{_bootstrap::link}">
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
<header th:insert="~{_header.html}"></header>

<div class="container">
    <div class="row align-items-start">
        <div class="col"></div>

        <div class="col">
            <!--/*@thymesVar id="registrationForm" type="com.springboot.printmastercrm.dto.RegistrationForm"*/-->
            <form th:action="@{/account/register}" th:object="${registrationForm}" method="post">
                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Ошибка</div>
                </div>
                <div class="mb-3">
                    <label for="exampleInputName1" class="form-label">Имя пользователя</label>
                    <input type="text" class="form-control" id="exampleInputName1" th:field="*{name}"
                           placeholder="Name">
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="exampleInputUsername1" class="form-label">Username</label>
                    <input type="text" class="form-control" id="exampleInputUsername1" th:field="*{username}"
                           placeholder="Username">
                    <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" th:field="*{password}"
                           placeholder="Password">
                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Зарегистрироваться</button>
            </form>
        </div>
        <div class="col"></div>
    </div>
</div>
<th:block th:insert="~{_bootstrap::script}"></th:block>
</body>
</html>
