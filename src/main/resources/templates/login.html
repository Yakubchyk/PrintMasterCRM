<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Вход в PrintMasterCRM</title>
    <th:block th:insert="~{_bootstrap::head-assets}"></th:block>
</head>
<body>
<header th:replace="~{_header :: nav}"></header>

<div class="container">
    <div class="row align-items-start">
        <div class="col">


        </div>
        <div class="col">
            <div class="alert alert-danger" th:if="${param.error}">Неверный логин или пароль</div>
            <div class="alert alert-success" th:if="${param.logout}">Вы вышли из системы</div>
            <form th:action="@{/account/login}" method="post">
                <div class="mb-3">
                    <label for="exampleInputUsername1" class="form-label">Username</label>
                    <input type="text" class="form-control" id="exampleInputUsername1" name="username" placeholder="Username">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Password</label>
                    <input type="password" class="form-control" id="exampleInputPassword1" name="password" placeholder="Password">
                </div>
                <button type="submit" class="btn btn-primary">Вход</button>
            </form>
        </div>
        <div class="col">

        </div>
    </div>
</div>
<th:block th:insert="~{_bootstrap::scripts}"></th:block>
</body>
</html>
