<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Главная</title>
    <th:block th:insert="~{_bootstrap::head-assets}"></th:block>
</head>

<body>
<header th:replace="~{_header :: nav}"></header>

<div class="container mt-4">
    <h3>PrintMasterCRM</h3>
    <p>Клиенты, расчёты тиснения и печати, заказы.</p>

    <div sec:authorize="isAnonymous()">
        <a class="btn btn-primary" th:href="@{/account/login}">Войти</a>
        <a class="btn btn-outline-secondary" th:href="@{/account/register}">Регистрация</a>
    </div>

    <div sec:authorize="hasRole('ROLE_MANAGER')">
        <a class="btn btn-primary" th:href="@{/profile}">Личный кабинет</a>
        <a class="btn btn-outline-secondary" th:href="@{/orders}">Заказы</a>
    </div>

    <div sec:authorize="hasRole('ROLE_ADMIN')">
        <a class="btn btn-primary" th:href="@{/admin/settings}">Админ-панель</a>
        <a class="btn btn-outline-secondary" th:href="@{/orders}">Заказы</a>
    </div>
</div>

<th:block th:insert="~{_bootstrap::scripts}"></th:block>
</body>

</html>
