<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Общие ресурсы страниц</title>
</head>
<body>

<!-- Подключается в <head> каждой страницы: <th:block th:insert="~{_bootstrap::head-assets}"></th:block> -->
<th:block th:fragment="head-assets">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</th:block>

<!-- Подключается в конце <body>: <th:block th:insert="~{_bootstrap::scripts}"></th:block> -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
