<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head('Настройки')}"></head>
<body>
<nav th:replace="~{_layout :: nav('settings')}"></nav>
<main>
    <h1>Настройки цен и единиц измерения</h1>
    <div th:replace="~{_layout :: alerts}"></div>

    <form th:action="@{/settings}" th:object="${settings}" method="post">
        <section>
            <h2>Единицы измерения</h2>
            <div class="row">
                <div>
                    <label for="lengthUnit">Размеры в расчётах</label>
                    <select id="lengthUnit" th:field="*{lengthUnit}">
                        <option th:each="u : ${lengthUnits}" th:value="${u.name()}" th:text="${u.label}">см</option>
                    </select>
                    <div class="hint">Ширина и длина вводятся в этих единицах. Уже сохранённые расчёты пересчитываются при показе.</div>
                </div>
            </div>
        </section>

        <section>
            <h2>Тиснение</h2>
            <div class="row">
                <div><label for="montageWorkPrice">Приладка</label>
                    <input type="number" id="montageWorkPrice" th:field="*{montageWorkPrice}" step="any" min="0" required></div>
                <div><label for="oneOttiskPrice">Цена одного оттиска</label>
                    <input type="number" id="oneOttiskPrice" th:field="*{oneOttiskPrice}" step="any" min="0" required></div>
                <div><label for="foilPrice">Цена фольги</label>
                    <input type="number" id="foilPrice" th:field="*{foilPrice}" step="any" min="0" required></div>
                <div><label for="foilAreaUnit">за единицу площади</label>
                    <select id="foilAreaUnit" th:field="*{foilAreaUnit}">
                        <option th:each="u : ${areaUnits}" th:value="${u.name()}" th:text="${u.label}">м²</option>
                    </select></div>
            </div>
        </section>

        <section>
            <h2>Печать</h2>
            <div class="row">
                <div><label for="pricePrint">Цена за один лист, одна сторона, бумага 90 г</label>
                    <input type="number" id="pricePrint" th:field="*{pricePrint}" step="any" min="0" required></div>
            </div>
        </section>

        <section>
            <h2>Клише</h2>
            <div class="row">
                <div><label for="clichePrice">Цена клише</label>
                    <input type="number" id="clichePrice" th:field="*{clichePrice}" step="any" min="0" required></div>
                <div><label for="clicheAreaUnit">за единицу площади</label>
                    <select id="clicheAreaUnit" th:field="*{clicheAreaUnit}">
                        <option th:each="u : ${areaUnits}" th:value="${u.name()}" th:text="${u.label}">см²</option>
                    </select></div>
                <div><label for="clicheMinPrice">Минимальная цена одного клише</label>
                    <input type="number" id="clicheMinPrice" th:field="*{clicheMinPrice}" step="any" min="0" required></div>
            </div>
        </section>

        <section>
            <h2>Коэффициент</h2>
            <div class="row">
                <div><label for="markup">Множитель итога любого расчёта</label>
                    <input type="number" id="markup" th:field="*{markup}" step="any" min="0.0001" required>
                    <div class="hint">1.25 означает +25% ко всем расчётам: тиснение, печать, клише.</div></div>
            </div>
        </section>

        <button type="submit">Сохранить</button>
    </form>
</main>
</body>
</html>
