<!-- Шапка сайта. Подключается так: <header th:replace="~{_header :: nav}"></header> -->
<nav th:fragment="nav" class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">PrintMasterCRM</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/account/register}">Регистрация</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/account/login}">Вход</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ROLE_MANAGER')">
                    <a class="nav-link" th:href="@{/profile}">Личный Кабинет</a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_MANAGER', 'ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/orders}">Заказы</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/settings}">Admin Panel</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/account/logout}" method="post">
                        <button type="submit" class="btn">Выход</button>
                    </form>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link disabled" aria-disabled="true" sec:authentication="name"></a>
                </li>
            </ul>
        </div>
    </div>
</nav>
