<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head(${customer.name})}"></head>
<body>
<nav th:replace="~{_layout :: nav('customers')}"></nav>
<main>
    <p><a th:href="@{/customers}">← Все клиенты</a></p>
    <h1 th:text="${customer.name}">Клиент</h1>
    <div th:replace="~{_layout :: alerts}"></div>

    <section>
        <div>Телефон: <b th:text="${customer.phoneNumber}"></b> · Email: <b th:text="${customer.email}"></b></div>
        <div th:if="${!customer.addressLine.isEmpty()}">Адрес: <b th:text="${customer.addressLine}"></b></div>
        <details style="margin-top:10px">
            <summary>Изменить данные клиента</summary>
            <form th:action="@{/customers/{id}/update(id=${customer.id})}" method="post" class="row">
                <div><label>Название организации</label><input type="text" name="name" th:value="${customer.name}" required></div>
                <div><label>Телефон</label><input type="text" name="phone" th:value="${customer.phoneNumber}" required></div>
                <div><label>Email</label><input type="email" name="email" th:value="${customer.email}" required></div>
                <div><label>Индекс</label><input type="text" name="postalCode" th:value="${customer.postalCode}" maxlength="20"></div>
                <div><label>Город</label><input type="text" name="city" th:value="${customer.city}" maxlength="100"></div>
                <div><label>Улица</label><input type="text" name="street" th:value="${customer.street}" maxlength="150"></div>
                <div><label>Номер дома</label><input type="text" name="houseNumber" th:value="${customer.houseNumber}" maxlength="20"></div>
                <div class="fixed"><button type="submit">Сохранить</button></div>
            </form>
            <form th:action="@{/customers/{id}/delete(id=${customer.id})}" method="post" style="margin-top:12px"
                  onsubmit="return confirm('Удалить клиента вместе со всеми его расчётами и заказами?')">
                <button type="submit" class="danger">Удалить клиента</button>
            </form>
        </details>
    </section>

    <section>
        <h2>Заказы клиента</h2>
        <div class="muted" th:if="${#lists.isEmpty(orders)}">Заказов пока нет</div>
        <table th:unless="${#lists.isEmpty(orders)}">
            <thead><tr><th>№</th><th>Дата</th><th>Описание</th><th class="num">Сумма</th><th>Статус</th></tr></thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td><a th:href="@{/orders/customer/{id}(id=${customer.id})}" th:text="${o.id}"></a></td>
                <td th:text="${#temporals.format(o.createdAt, 'dd.MM.yyyy')}"></td>
                <td th:text="${o.product}"></td>
                <td class="num total" th:text="${#numbers.formatDecimal(o.totalCost, 0, 'WHITESPACE', 2, 'COMMA')}"></td>
                <td th:text="${o.status.label}"></td>
            </tr>
            </tbody>
        </table>
        <p><a class="button" th:href="@{/orders/new(customerId=${customer.id})}">+ Новый заказ</a>
           <a class="button secondary" th:href="@{/orders/customer/{id}(id=${customer.id})}">Подробности заказов</a></p>
    </section>
</main>
</body>
</html>
