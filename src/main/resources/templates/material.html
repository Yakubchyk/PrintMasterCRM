<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head(${material.name})}"></head>
<body>
<nav th:replace="~{_layout :: nav('materials')}"></nav>
<main>
    <p><a th:href="@{/materials}">← Все материалы</a></p>
    <h1 th:text="${material.name}">Материал</h1>
    <div th:replace="~{_layout :: alerts}"></div>

    <section>
        <div class="muted" th:text="${material.category.label}"></div>
        <div th:if="${material.sheetSize != null}">Размер листа: <b th:text="${material.sheetSize}"></b></div>
        <div>На складе: <b class="total" th:text="${material.stock.stripTrailingZeros().toPlainString()} + ' ' + ${material.unit.label}"></b>
            · в резерве под заказы: <b th:text="${material.reserved.stripTrailingZeros().toPlainString()} + ' ' + ${material.unit.label}"></b>
            · свободно: <b th:text="${material.available.stripTrailingZeros().toPlainString()} + ' ' + ${material.unit.label}"></b></div>
        <div class="row" style="margin-top:14px">
            <form th:action="@{/materials/{id}/receive(id=${material.id})}" method="post" class="row" style="flex:1 1 320px">
                <div><label>Приход</label><input type="number" name="quantity" th:attr="step=${material.unit.whole} ? '1' : 'any'" min="0" required></div>
                <div><label>Комментарий</label><input type="text" name="note" maxlength="255" placeholder="Поставка, накладная…"></div>
                <div class="fixed"><button type="submit">Принять</button></div>
            </form>
            <form th:action="@{/materials/{id}/consume(id=${material.id})}" method="post" class="row" style="flex:1 1 320px">
                <div><label>Расход</label><input type="number" name="quantity" th:attr="step=${material.unit.whole} ? '1' : 'any'" min="0" required></div>
                <div><label>Комментарий</label><input type="text" name="note" maxlength="255" placeholder="Заказ №…"></div>
                <div class="fixed"><button type="submit" class="secondary">Списать</button></div>
            </form>
        </div>
    </section>

    <section>
        <h2>История движения</h2>
        <div class="muted" th:if="${#lists.isEmpty(movements)}">Записей нет</div>
        <table th:unless="${#lists.isEmpty(movements)}">
            <thead><tr><th>Дата</th><th>Операция</th><th class="num">Количество</th><th>Комментарий</th></tr></thead>
            <tbody>
            <tr th:each="m : ${movements}">
                <td th:text="${#temporals.format(m.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td th:text="${m.movementType.label}"></td>
                <td class="num" th:text="${(m.movementType.name() == 'IN' ? '+' : '−') + m.quantity.stripTrailingZeros().toPlainString()}"></td>
                <td class="muted" th:text="${m.note}"></td>
            </tr>
            </tbody>
        </table>
    </section>

    <section>
        <details>
            <summary>Изменить материал</summary>
            <form th:action="@{/materials/{id}/update(id=${material.id})}" method="post" class="row">
                <div><label>Название</label><input type="text" name="name" th:value="${material.name}" required></div>
                <div th:if="${material.category.name() == 'PAPER'}"><label>Размер листа</label>
                    <input type="text" name="sheetSize" th:value="${material.sheetSize}" maxlength="50"></div>
                <div><label>Примечание</label><input type="text" name="note" th:value="${material.note}" maxlength="255"></div>
                <div class="fixed"><button type="submit">Сохранить</button></div>
            </form>

        </details>
    </section>
    <section>
        <form th:action="@{/materials/{id}/delete(id=${material.id})}" method="post"
              onsubmit="return confirm('Удалить материал вместе с историей движения?')">
            <button type="submit" class="danger">Удалить материал</button>
            <span class="muted"> — если он внесён по ошибке. Материал, который уже есть в заказах, удалить нельзя.</span>
        </form>
    </section>
</main>
</body>
</html>
