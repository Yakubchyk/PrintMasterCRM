<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head('Заказы')}"></head>
<body>
<nav th:replace="~{_layout :: nav('orders')}"></nav>
<main>
    <h1>Заказы</h1>
    <div th:replace="~{_layout :: alerts}"></div>

    <section>
        <form th:action="@{/orders}" method="get" class="row">
            <div>
                <label for="q">Поиск: клиент, номер заказа, описание, материал…</label>
                <input type="search" id="q" name="q" th:value="${q}">
            </div>
            <div class="fixed">
                <button type="submit">Найти</button>
                <a class="button secondary" th:href="@{/orders}" th:if="${!q.isEmpty()}">Сбросить</a>
                <a class="button" th:href="@{/orders/new}">+ Новый заказ</a>
            </div>
        </form>
    </section>

    <!-- без поискового запроса: клиенты -->
    <section th:if="${summaries != null}">
        <div class="muted" th:if="${#lists.isEmpty(summaries)}">Клиентов нет. Сначала добавьте клиента в разделе «Клиенты».</div>
        <table th:unless="${#lists.isEmpty(summaries)}">
            <thead><tr><th>Клиент</th><th class="num">Заказов</th><th class="num">Не отгружено</th><th class="num">Сумма</th><th>Последний заказ</th></tr></thead>
            <tbody>
            <tr th:each="s : ${summaries}">
                <td><a th:href="@{/orders/customer/{id}(id=${s.customer.id})}" th:text="${s.customer.name}">Клиент</a></td>
                <td class="num" th:text="${s.orderCount}"></td>
                <td class="num" th:text="${s.activeCount}"></td>
                <td class="num total" th:text="${#numbers.formatDecimal(s.total, 0, 'WHITESPACE', 2, 'COMMA')}"></td>
                <td class="muted" th:text="${s.lastOrderAt != null} ? ${#temporals.format(s.lastOrderAt, 'dd.MM.yyyy')} : '—'"></td>
            </tr>
            </tbody>
        </table>
    </section>

    <!-- с запросом: найденные заказы -->
    <section th:if="${orders != null}">
        <h2 th:text="'Найдено заказов: ' + ${#lists.size(orders)}">Найдено</h2>
        <th:block th:each="o : ${orders}">
            <div th:replace="~{_order :: card(${o}, ${consumption.get(o.id)}, ${statuses}, true)}"></div>
        </th:block>
    </section>
</main>
</body>
</html>
