<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head th:insert="~{_bootstrap::link}">
    <meta charset="UTF-8">
    <title>Заказы</title>
</head>
<body>
<header th:insert="~{_header.html}"></header>

<div class="container mt-3">
    <h4>Заказы</h4>

    <div class="filter-tabs mb-3">
        <a th:href="@{/orders(status='ALL',customerId=${customerId})}">Все</a> |
        <a th:href="@{/orders(status='NEW',customerId=${customerId})}">Новые</a> |
        <a th:href="@{/orders(status='IN_PROGRESS',customerId=${customerId})}">В работе</a> |
        <a th:href="@{/orders(status='READY',customerId=${customerId})}">Готовые</a> |
        <a th:href="@{/orders(status='SHIPPED',customerId=${customerId})}">Архив</a>
    </div>

    <div class="text-muted" th:if="${#lists.isEmpty(orders)}">Заказов нет</div>

    <table class="table table-striped" th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Клиент</th>
            <th>Описание</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.customer.username}"></td>
            <td th:text="${order.product}"></td>
            <td th:text="${order.totalCost}"></td>
            <td th:text="${order.status}"></td>
            <td>
                <form th:action="@{/orders/status/{id}(id=${order.id})}" method="post">
                    <select name="status">
                        <option value="NEW" th:selected="${order.status?.name() == 'NEW'}">Новый</option>
                        <option value="IN_PROGRESS" th:selected="${order.status?.name() == 'IN_PROGRESS'}">В работе</option>
                        <option value="READY" th:selected="${order.status?.name() == 'READY'}">Готов</option>
                        <option value="SHIPPED" th:selected="${order.status?.name() == 'SHIPPED'}">Отгружен</option>
                    </select>
                    <button type="submit">Обновить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<th:block th:insert="~{_bootstrap::script}"></th:block>
</body>
</html>
