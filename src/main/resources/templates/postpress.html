<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Расчет тиснения</title>
    <th:block th:insert="~{_bootstrap::head-assets}"></th:block>
</head>
<body>
<header th:replace="~{_header :: nav}"></header>

<div class="container">
    <div class="row align-items-start">

        <div class="col">

        </div>



        <div class="col">
            <h4>Калькулятор расчета стоимости</h4>
            <div class="alert alert-danger" role="alert" th:if="${error != null}" th:text="${error}">Ошибка</div>
            <!--/*@thymesVar id="postPress" type="com.springboot.printmastercrm.entity.PostPress"*/-->
            <form th:action="@{/profile/postpress}" th:object="${postPress}" method="post">
                <!--/*@thymesVar id="selectedCustomer" type="com.springboot.printmastercrm.entity.Customer"*/-->
                <input type="hidden" name="customerId" th:value="${selectedCustomer.id}">
                <div class="mb-3">
                    <label for="exampleInputName1" class="form-label">Ширина (см):</label>
                    <input type="number" class="form-control" id="exampleInputName1" th:field="*{widthSM}" step="any" min="0" required>
                </div>
                <div class="mb-3">
                    <label for="exampleInputName2" class="form-label">Длина (см):</label>
                    <input type="number" class="form-control" id="exampleInputName2" th:field="*{lengthSM}" step="any" min="0" required>
                </div>
                <div class="mb-3">
                    <label for="exampleInputName3" class="form-label">Тираж:</label>
                    <input type="number" class="form-control" id="exampleInputName3" th:field="*{quantity}" min="1" step="1" required>
                </div>
                <div>
                    <input type="hidden" th:field="*{totalPrice}" readonly>
                </div>
                <button type="submit">Сохранить расчет</button>
            </form>
        </div>

        <div class="col">

        </div>

    </div>
</div>


<th:block th:insert="~{_bootstrap::scripts}"></th:block>
</body>
</html>
