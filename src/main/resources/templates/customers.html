<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{_layout :: head('Клиенты')}"></head>
<body>
<nav th:replace="~{_layout :: nav('customers')}"></nav>
<main class="p-customers">
    <h1>Клиенты</h1>
    <div th:replace="~{_layout :: alerts}"></div>

    <section>
        <form th:action="@{/customers}" method="get" class="row">
            <div>
                <label for="q">Поиск по названию, телефону или email</label>
                <input type="search" id="q" name="q" th:value="${q}">
            </div>
            <div class="fixed">
                <button type="submit">Найти</button>
                <a class="button secondary" th:href="@{/customers}" th:if="${!q.isEmpty()}">Сбросить</a>
            </div>
        </form>

        <div class="muted" th:if="${#lists.isEmpty(customers)}" style="margin-top:12px">Клиентов нет</div>
        <table th:unless="${#lists.isEmpty(customers)}">
            <thead>
            <tr><th>Название организации</th><th>Email</th><th>Телефон</th><th>Город</th></tr>
            </thead>
            <tbody>
            <tr th:each="c : ${customers}">
                <td><a th:href="@{/customers/{id}(id=${c.id})}" th:text="${c.name}">Название</a></td>
                <td th:text="${c.email}">Email</td>
                <td th:text="${c.phoneNumber}">Телефон</td>
                <td th:text="${c.city}"></td>
            </tr>
            </tbody>
        </table>
    </section>

    <section>
        <details>
            <summary>Новый клиент</summary>
            <form th:action="@{/customers}" method="post">
                <div th:replace="~{_client :: fields(null)}"></div>
                <p style="margin-bottom:0"><button type="submit">Добавить клиента</button></p>
            </form>
        </details>
    </section>
</main>
</body>
</html>
